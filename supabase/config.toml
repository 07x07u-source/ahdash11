project_id = "ahdash-11"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = true
sql_paths = ["./seed/001_demo.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["com.ahdash.eleven://login-callback", "http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.submit-answer]
verify_jwt = true

[functions.create-room]
verify_jwt = true

[functions.join-room]
verify_jwt = true

[functions.queue-matchmaking]
verify_jwt = true

[functions.wallet-transaction]
verify_jwt = true

[functions.import-validate]
verify_jwt = true

[functions.import-commit]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.revenuecat-webhook]
verify_jwt = false

[functions.dispatch-notifications]
verify_jwt = false

[functions.admob-reward]
verify_jwt = false
